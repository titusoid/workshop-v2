<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain Radar</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 2rem; background: #111; color: #eee; }
    h1 { font-size: 1.8rem; margin-bottom: .75rem; }
    .controls, .downloads {
      display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: .75rem 0;
    }
    input[type="search"], select {
      background:#222; color:#eee; border:1px solid #444; padding:.35rem .55rem; border-radius:6px;
    }
    input[type="checkbox"] { transform: scale(1.2); }
    .btn {
      background:#333; color:#eee; border:1px solid #555; border-radius:6px;
      padding:.45rem .8rem; text-decoration:none; display:inline-flex; align-items:center; gap:.4rem;
    }
    .btn:hover { background:#444; }
    table { width:100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { border-bottom:1px solid #2a2a2a; padding:.5rem .6rem; text-align:left; }
    th { background:#1a1a1a; font-weight:600; }
    tr:nth-child(even) { background:#171717; }
    a { color:#58a6ff; text-decoration:none; }
    a:hover { text-decoration: underline; }
    .sev { padding:.1rem .5rem; border-radius:.4rem; font-size:.85rem; font-weight:600; }
    .sev-critical { background:#b30000; color:#fff; }
    .sev-high { background:#cc3300; color:#fff; }
    .sev-medium { background:#d78d00; color:#111; }
    .sev-low { background:#4b9b4b; color:#111; }
    .sev-unknown { background:#555; color:#eee; }
    #meta { opacity:.7; }
    @media (max-width: 720px) {
      body { margin: 1rem; }
      table, thead, tbody, th, td, tr { display:block; }
      th { display:none; }
      td { border:none; border-bottom:1px solid #2a2a2a; }
      td::before { content: attr(data-label); font-weight:600; display:block; margin-bottom:.2rem; opacity:.7; }
    }
  </style>
</head>
<body>
  <h1>Supply Chain Radar</h1>

  <div class="controls">
    <input id="searchInput" type="search" placeholder="Filter by package or CVE"/>
    <select id="severityFilter">
      <option value="all">All severities</option>
      <option value="Critical">Critical</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>

    <label style="display:flex;gap:.4rem;align-items:center;">
      <input type="checkbox" id="group-by-cve"/>
      Group by CVE (dedupe)
    </label>

    <button class="btn" id="reloadBtn">Reload</button>

    <span id="meta"></span>
    <span style="margin-left:auto; opacity:.8;">Rows: <strong id="vuln-count">0</strong></span>
  </div>

  <div class="downloads">
    <a id="dl-cdx"   class="btn" href="./reports/sbom.cdx.json"  download>⬇ CycloneDX SBOM (JSON)</a>
    <a id="dl-spdx"  class="btn" href="./reports/sbom.spdx.json" download>⬇ SPDX SBOM (JSON)</a>
    <a id="dl-grype" class="btn" href="./reports/grype.json"     download>⬇ Grype report (JSON)</a>

    <a id="dl-cdx-sig" class="btn" href="./reports/sbom.cdx.json.sig" download style="display:none;">🔏 SBOM signature (.sig)</a>
    <a id="dl-cdx-pem" class="btn" href="./reports/sbom.cdx.json.pem" download style="display:none;">📜 Signing cert (.pem)</a>
    <span id="sig-badge" style="display:none; margin-left:.25rem; opacity:.85;">🔐 SBOM signed (Sigstore)</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>CVE</th>
        <th>Severity</th>
        <th>Package</th>
        <th>Version</th>
        <th>Fixed in</th>
      </tr>
    </thead>
    <tbody id="vuln-tbody">
      <tr><td colspan="5" style="opacity:.7;">Loading...</td></tr>
    </tbody>
  </table>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
