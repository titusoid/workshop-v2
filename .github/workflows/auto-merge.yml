# .github/workflows/merge-on-merge-label.yml
name: Enable auto-merge on label

on:
  pull_request:
    types: [labeled]   # only runs when a label is added

permissions:
  contents: read
  pull-requests: write

jobs:
  enable:
    if: >
      github.event.label.name == 'merge' &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          NUM:      ${{ github.event.pull_request.number }}
        run: |
          count=$(gh pr view "$NUM" --repo "$REPO" --json reviews \
            --jq '[.reviews[] | select(.state=="APPROVED")] | length')
          [ "$count" -ge 1 ] || { echo "No approvals yet"; exit 1; }

      - name: Enable GitHub Auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          NUM:      ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$NUM" --repo "$REPO" --auto --squash
