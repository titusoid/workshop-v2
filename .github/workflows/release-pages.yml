name: Build & Publish Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write     # required for Sigstore keyless (Fulcio)

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0) Checkout + Node
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 1) Build your static site (dist/)
      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
      # -> built files in ./dist

      # 2) Supply-chain: SBOM + vuln scan (reports/)
      - name: Install Syft & Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOMs (SPDX + CycloneDX)
        run: |
          mkdir -p reports
          syft dir:. -o spdx-json=reports/sbom.spdx.json
          syft dir:. -o cyclonedx-json=reports/sbom.cdx.json

      - name: Run vulnerability scan (Grype → JSON)
        run: |
          # JSON for your frontend; SARIF lives in PR CI
          grype sbom:reports/sbom.cdx.json --output json > reports/grype.json || true

      # 3) Sign artifacts with Cosign (keyless)
      - name: Install cosign (pinned)
        run: |
          COSIGN_VERSION=v2.4.1
          curl -sSL -o cosign.tgz https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf cosign.tgz cosign
          cosign version

      - name: Create site checksum
        run: |
          # Stable, small blob to sign representing the built site
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > reports/site.sha256

      - name: Sign SBOM + checksum (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          # Sign CycloneDX SBOM
          cosign sign-blob \
            --yes \
            --bundle             reports/sbom.cdx.json.bundle \
            --output-signature   reports/sbom.cdx.json.sig \
            --output-certificate reports/sbom.cdx.json.pem \
            reports/sbom.cdx.json

          # Sign site checksum
          cosign sign-blob \
            --yes \
            --bundle             reports/site.sha256.bundle \
            --output-signature   reports/site.sha256.sig \
            --output-certificate reports/site.sha256.pem \
            reports/site.sha256

      # 4) Stage for Pages (site/)
      - name: Prepare Pages artifact
        run: |
          mkdir -p site/reports
          cp -r dist/* site/
          cp -r reports/* site/reports/

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
